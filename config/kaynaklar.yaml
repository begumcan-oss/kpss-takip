# Kontrol edilen ilan kaynakları.
# baslangic        : taramanın başladığı sayfa(lar)
# rss              : sitenin RSS beslemesi (varsa en güvenilir yol budur)
# render           : true ise sayfa gerçek bir tarayıcıda açılır (JavaScript ile çalışan siteler)
# aday_url_desen   : bağlantı adresi bu ifadeye uyuyorsa ilan sayılır
# metin_filtresi   : true ise bağlantı metninde "personel alımı" gibi ifadeler aranır
# takip_kelimeleri : bu kelimeler geçen bağlantılara bir seviye daha girilir
# bekle            : tarayıcıda sayfa yüklendikten sonra beklenecek süre (milisaniye)
# bolumle          : tek sayfada birden çok ilan varsa (Resmî Gazete) sayfayı ilanlara böler

kaynaklar:
  - ad: kariyerkapisi.gov.tr
    rss: ["https://kariyerkapisi.gov.tr/RSS"]
    render: true
    anahtar_surumu: 2

  - ad: ilan.gov.tr
    baslangic: ["https://www.ilan.gov.tr/ilan/tum-ilanlar/personel-alimi?ats=5"]
    render: true
    aday_url_desen: "ilan\\.gov\\.tr/ilan/\\d+/"
    metin_filtresi: false
    derinlik: 0

  - ad: resmigazete.gov.tr
    baslangic: ["https://www.resmigazete.gov.tr/"]
    render: false
    aday_metin_kelimeleri: ["cesitli ilan"]
    derinlik: 0
    bolumle: true

  - ad: iskur.gov.tr (memur)
    baslangic: ["https://www.iskur.gov.tr/ilanlar/kamu-memur-alim-ilanlari/"]
    render: false
    metin_filtresi: true
    takip_kelimeleri: ["sonraki", "devami"]
    max_takip: 2

  - ad: iskur.gov.tr (işçi)
    baslangic: ["https://www.iskur.gov.tr/ilanlar/kurumdisi-kamu-isci-alim-ilanlari/"]
    render: false
    metin_filtresi: true
    kpsssiz: true
    takip_kelimeleri: ["sonraki", "devami"]
    max_takip: 2

  - ad: osym.gov.tr
    tur: osym
    baslangic: ["https://www.osym.gov.tr/"]
    render: false
    aday_metin_kelimeleri: ["kpss", "tercih", "kilavuz"]
    takip_kelimeleri: ["duyurular"]
    max_takip: 2
