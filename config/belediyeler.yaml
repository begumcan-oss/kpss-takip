# Taranacak belediyeler. Her ilin il/büyükşehir belediyesi otomatik eklenir.
# Sistem site adreslerini kendisi bulmaya çalışır (örn. ilceadi.bel.tr).
# Bulamadığı bir belediyenin adresini aşağıdaki "elle_adresler" kısmına ekleyebilirsiniz.

elle_adresler:
  "İstanbul/İl belediyesi": "https://www.ibb.istanbul"
  "Kocaeli/İl belediyesi": "https://www.kocaeli.bel.tr"
  "Sakarya/İl belediyesi": "https://www.sakarya.bel.tr"
  # Örnek: "İzmir/Buca": "https://www.buca.bel.tr"

